name: release

# main 에 push 했을 때 package.json 의 version 이 새로우면 설치 파일을 빌드하고 GitHub Release 로 올린다.
# 같은 버전의 릴리스가 이미 있으면 아무것도 빌드하지 않는다 (version 을 올리지 않은 push 는 테스트만 실행).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# 동시에 두 번 실행되면 같은 버전을 두 번 만들려다 실패하므로 한 번에 하나씩만 실행한다
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: npm test
      - name: Read version and check for an existing release
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists - nothing to build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION not found - will build."
          fi

  build:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          $exe = (Resolve-Path 'dist\win-unpacked\3 Agents.exe').Path
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-test', "--smoke-out=$out" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'smoke test timed out' }
          if (-not (Test-Path $out)) { throw 'smoke test produced no result' }
          Get-Content $out
          if ($p.ExitCode -ne 0) { throw "smoke test failed (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $out -Pattern "version=$env:VERSION" -Quiet)) { throw 'version mismatch in smoke result' }
      - name: Verify release assets
        shell: bash
        run: |
          ls -la dist
          test -f "dist/3-Agents-Setup-${VERSION}.exe"
          test -f "dist/3-Agents-Setup-${VERSION}.exe.blockmap"
          test -f dist/latest.yml
          grep -q "version: ${VERSION}" dist/latest.yml
          grep -q "3-Agents-Setup-${VERSION}.exe" dist/latest.yml
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release-notes/<버전>.md 가 있으면 그것을(업데이트 창에도 표시됨), 없으면 자동 생성 노트를 쓴다
          if [ -f "release-notes/${VERSION}.md" ]; then NOTES=(--notes-file "release-notes/${VERSION}.md"); else NOTES=(--generate-notes); fi
          gh release create "v${VERSION}" \
            "dist/3-Agents-Setup-${VERSION}.exe" \
            "dist/3-Agents-Setup-${VERSION}.exe.blockmap" \
            "dist/latest.yml" \
            --target "${GITHUB_SHA}" \
            --title "3 Agents v${VERSION}" \
            "${NOTES[@]}"
